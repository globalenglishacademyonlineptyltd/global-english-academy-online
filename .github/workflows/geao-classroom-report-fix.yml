name: GEAO classroom and report fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[geao-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          classroom = Path('app/classroom/[room]/page.tsx')
          s = classroom.read_text()

          old = ''' const localVideo=useRef<HTMLVideoElement|null>(null),remoteVideo=useRef<HTMLVideoElement|null>(null),localStream=useRef<MediaStream|null>(null),remoteStream=useRef<MediaStream|null>(null),peer=useRef<RTCPeerConnection|null>(null),after=useRef("1970-01-01T00:00:00.000Z"),seen=useRef<Set<string>>(new Set()),poller=useRef<any>(null),recorder=useRef<MediaRecorder|null>(null),recordChunks=useRef<Blob[]>([]),recordStarted=useRef<number>(0),savePromise=useRef<Promise<void>|null>(null),canvas=useRef<HTMLCanvasElement|null>(null),annotationCanvas=useRef<HTMLCanvasElement|null>(null),drawStart=useRef<any>(null),shouldSaveRecording=useRef(true);'''
          new = ''' const localVideo=useRef<HTMLVideoElement|null>(null),remoteVideo=useRef<HTMLVideoElement|null>(null),localStream=useRef<MediaStream|null>(null),remoteStream=useRef<MediaStream|null>(null),peer=useRef<RTCPeerConnection|null>(null),pendingIce=useRef<any[]>([]),after=useRef("1970-01-01T00:00:00.000Z"),seen=useRef<Set<string>>(new Set()),poller=useRef<any>(null),recorder=useRef<MediaRecorder|null>(null),recordChunks=useRef<Blob[]>([]),recordStarted=useRef<number>(0),savePromise=useRef<Promise<void>|null>(null),canvas=useRef<HTMLCanvasElement|null>(null),annotationCanvas=useRef<HTMLCanvasElement|null>(null),drawStart=useRef<any>(null),shouldSaveRecording=useRef(true);'''
          s = s.replace(old, new)

          old = ''' const createPeer=()=>{if(peer.current)return peer.current;const p=new RTCPeerConnection({iceServers:[{urls:"stun:stun.google.com:19302"},{urls:"stun:stun1.google.com:19302"}]});peer.current=p;if(localStream.current)localStream.current.getTracks().forEach(t=>p.addTrack(t,localStream.current as MediaStream));p.onicecandidate=e=>{if(e.candidate)signal({type:"ice",candidate:e.candidate});};p.ontrack=e=>{if(!remoteStream.current)remoteStream.current=new MediaStream();if(!remoteStream.current.getTracks().some(t=>t.id===e.track.id))remoteStream.current.addTrack(e.track);if(remoteVideo.current)remoteVideo.current.srcObject=remoteStream.current;};p.onconnectionstatechange=()=>{setConnected(p.connectionState==="connected");setStatus(p.connectionState==="connected"?"Connected":"Waiting for partner…");};return p;};'''
          new = ''' const createPeer=()=>{if(peer.current)return peer.current;const p=new RTCPeerConnection({iceServers:[{urls:"stun:stun.google.com:19302"},{urls:"stun:stun1.google.com:19302"}]});peer.current=p;if(localStream.current)localStream.current.getTracks().forEach(t=>p.addTrack(t,localStream.current as MediaStream));p.onicecandidate=e=>{if(e.candidate)signal({type:"ice",candidate:e.candidate});};p.ontrack=e=>{if(!remoteStream.current)remoteStream.current=new MediaStream();if(!remoteStream.current.getTracks().some(t=>t.id===e.track.id))remoteStream.current.addTrack(e.track);setConnected(true);setStatus("Connected");requestAnimationFrame(()=>{if(remoteVideo.current&&remoteStream.current){remoteVideo.current.srcObject=remoteStream.current;void remoteVideo.current.play().catch(()=>{});}});};p.onconnectionstatechange=()=>{const ok=p.connectionState==="connected";setConnected(ok);setStatus(ok?"Connected":"Waiting for partner…");if(ok)requestAnimationFrame(()=>{if(remoteVideo.current&&remoteStream.current){remoteVideo.current.srcObject=remoteStream.current;void remoteVideo.current.play().catch(()=>{});}});};return p;};'''
          s = s.replace(old, new)

          old = '''if(x.type==="annotation"&&student){setAnnotations(v=>v.concat([x.annotation]));return;}if(x.type==="annotation_replace"&&student){setAnnotations(Array.isArray(x.annotations)?x.annotations:[]);return;}'''
          new = '''if(x.type==="annotation"&&(student||teacher)){setAnnotations(v=>v.concat([x.annotation]));return;}if(x.type==="annotation_replace"&&(student||teacher)){setAnnotations(Array.isArray(x.annotations)?x.annotations:[]);return;}'''
          s = s.replace(old, new)

          old = '''const p=createPeer();try{if(x.type==="offer"&&(roleRef.current==="STUDENT"||roleRef.current==="ADMIN")){await p.setRemoteDescription(x.description);const a=await p.createAnswer();await p.setLocalDescription(a);await signal({type:"answer",description:p.localDescription});}else if(x.type==="answer"&&roleRef.current==="TEACHER")await p.setRemoteDescription(x.description);else if(x.type==="ice"&&x.candidate)await p.addIceCandidate(x.candidate);}catch{}};'''
          new = '''const p=createPeer();try{if(x.type==="offer"&&(roleRef.current==="STUDENT"||roleRef.current==="ADMIN")){await p.setRemoteDescription(x.description);for(const c of pendingIce.current.splice(0))await p.addIceCandidate(c);const a=await p.createAnswer();await p.setLocalDescription(a);await signal({type:"answer",description:p.localDescription});}else if(x.type==="answer"&&roleRef.current==="TEACHER"){await p.setRemoteDescription(x.description);for(const c of pendingIce.current.splice(0))await p.addIceCandidate(c);}else if(x.type==="ice"&&x.candidate){if(p.remoteDescription)await p.addIceCandidate(x.candidate);else pendingIce.current.push(x.candidate);}}catch{} };'''
          s = s.replace(old, new)

          old = ''' const finishAnnotation=(e:any)=>{if(!teacher||!drawStart.current||!annotationCanvas.current)return;const end=annotationPoint(e),start=drawStart.current;drawStart.current=null;if(tool==="eraser"){setAnnotations(v=>{const next=v.slice(0,-1);signal({type:"annotation_replace",annotations:next});return next;});return;}let a:any={type:tool,color:toolColor,size:toolSize,x1:start.x,y1:start.y,x2:end.x,y2:end.y};if(tool==="pen")a.points=start.points.concat([end]);if(tool==="text"){const txt=window.prompt("Text to place on the classroom lesson:");if(!txt)return;a.text=txt;}setAnnotations(v=>v.concat([a]));signal({type:"annotation",annotation:a});};'''
          new = ''' const finishAnnotation=(e:any)=>{const canAnnotate=teacher||(student&&interactive);if(!canAnnotate||!drawStart.current||!annotationCanvas.current)return;const end=annotationPoint(e),start=drawStart.current;drawStart.current=null;if(tool==="eraser"){setAnnotations(v=>{const next=v.slice(0,-1);signal({type:"annotation_replace",annotations:next});return next;});return;}let a:any={type:tool,color:toolColor,size:toolSize,x1:start.x,y1:start.y,x2:end.x,y2:end.y};if(tool==="pen")a.points=start.points.concat([end]);if(tool==="text"){const txt=window.prompt("Text to place on the classroom lesson:");if(!txt)return;a.text=txt;}setAnnotations(v=>v.concat([a]));signal({type:"annotation",annotation:a});};'''
          s = s.replace(old, new)

          old = '''<canvas ref={annotationCanvas} className={"gc-annotation-canvas "+(teacher?"teacher-annotation":"student-annotation")} onPointerDown={e=>{if(!teacher)return;const p=annotationPoint(e);drawStart.current={...p,points:[p]};(e.currentTarget as HTMLCanvasElement).setPointerCapture(e.pointerId);}} onPointerMove={e=>{if(!teacher||!drawStart.current||!annotationCanvas.current)return;const p=annotationPoint(e);if(tool==="pen"||tool==="eraser")drawStart.current.points.push(p);}} onPointerUp={finishAnnotation}/>'''
          new = '''<canvas ref={annotationCanvas} className={"gc-annotation-canvas "+(teacher?"teacher-annotation":"student-annotation")} onPointerDown={e=>{const canAnnotate=teacher||(student&&interactive);if(!canAnnotate)return;const p=annotationPoint(e);drawStart.current={...p,points:[p]};(e.currentTarget as HTMLCanvasElement).setPointerCapture(e.pointerId);}} onPointerMove={e=>{const canAnnotate=teacher||(student&&interactive);if(!canAnnotate||!drawStart.current||!annotationCanvas.current)return;const p=annotationPoint(e);if(tool==="pen"||tool==="eraser")drawStart.current.points.push(p);}} onPointerUp={finishAnnotation}/>'''
          s = s.replace(old, new)

          old = '''{teacher?<><strong>Classroom Tools</strong><button className={tool==="pen"?"active":""} onClick={()=>setTool("pen")}>✏️ Pencil</button><button className={tool==="text"?"active":""} onClick={()=>setTool("text")}>🔤 Text</button><select aria-label="Shape" value={shape} onChange={e=>{setShape(e.target.value);setTool(e.target.value)}}><option value="rectangle">▭ Rectangle</option><option value="circle">◯ Circle</option><option value="line">／ Line</option><option value="arrow">➜ Arrow</option></select><button className={tool==="eraser"?"active":""} onClick={()=>setTool("eraser")}>⌫ Eraser</button><label>Color <input type="color" value={toolColor} onChange={e=>setToolColor(e.target.value)}/></label><label>Size <input type="range" min="1" max="12" value={toolSize} onChange={e=>setToolSize(Number(e.target.value))}/></label><button onClick={()=>setAnnotations(v=>{const next=v.slice(0,-1);signal({type:"annotation_replace",annotations:next});return next;})}>Undo</button><button onClick={()=>{setAnnotations([]);signal({type:"annotation_replace",annotations:[]});}}>Clear</button><span className="tool-spacer"/><button>‹</button><span className="page-count">Page 1</span><button>›</button></>:student?<><strong>Student Tools</strong><span>{!teacherPresent?"Waiting for your teacher to enter the classroom":interactive?"Your teacher has enabled interaction.":"Waiting for your teacher to enable interaction."}</span><span className="tool-spacer"/><button type="button" onClick={()=>{signal({type:"student_ready"});setStatus("You let your teacher know you are ready");}}>🙋 I’m Ready</button></>:<span>Admin monitoring mode</span>}'''
          new = '''{teacher?<><strong>Classroom Tools</strong><button className={tool==="pen"?"active":""} onClick={()=>setTool("pen")}>✏️ Pencil</button><button className={tool==="text"?"active":""} onClick={()=>setTool("text")}>🔤 Text</button><select aria-label="Shape" value={shape} onChange={e=>{setShape(e.target.value);setTool(e.target.value)}}><option value="rectangle">▭ Rectangle</option><option value="circle">◯ Circle</option><option value="line">／ Line</option><option value="arrow">➜ Arrow</option></select><button className={tool==="eraser"?"active":""} onClick={()=>setTool("eraser")}>⌫ Eraser</button><label>Color <input type="color" value={toolColor} onChange={e=>setToolColor(e.target.value)}/></label><label>Size <input type="range" min="1" max="12" value={toolSize} onChange={e=>setToolSize(Number(e.target.value))}/></label><button onClick={()=>setAnnotations(v=>{const next=v.slice(0,-1);signal({type:"annotation_replace",annotations:next});return next;})}>Undo</button><button onClick={()=>{setAnnotations([]);signal({type:"annotation_replace",annotations:[]});}}>Clear</button><span className="tool-spacer"/><button>‹</button><span className="page-count">Page 1</span><button>›</button></>:student?<><strong>Student Tools</strong><button disabled={!interactive} className={tool==="pen"?"active":""} onClick={()=>setTool("pen")}>✏️ Pencil</button><button disabled={!interactive} className={tool==="text"?"active":""} onClick={()=>setTool("text")}>🔤 Text</button><select disabled={!interactive} aria-label="Shape" value={shape} onChange={e=>{setShape(e.target.value);setTool(e.target.value)}}><option value="rectangle">▭ Rectangle</option><option value="circle">◯ Circle</option><option value="line">／ Line</option><option value="arrow">➜ Arrow</option></select><button disabled={!interactive} className={tool==="eraser"?"active":""} onClick={()=>setTool("eraser")}>⌫ Eraser</button><label>Color <input disabled={!interactive} type="color" value={toolColor} onChange={e=>setToolColor(e.target.value)}/></label><label>Size <input disabled={!interactive} type="range" min="1" max="12" value={toolSize} onChange={e=>setToolSize(Number(e.target.value))}/></label><button disabled={!interactive} onClick={()=>setAnnotations(v=>{const next=v.slice(0,-1);signal({type:"annotation_replace",annotations:next});return next;})}>Undo</button><button disabled={!interactive} onClick={()=>{setAnnotations([]);signal({type:"annotation_replace",annotations:[]});}}>Clear</button><span className="tool-spacer"/><button disabled={!interactive}>‹</button><span className="page-count">Page 1</span><button disabled={!interactive}>›</button></>:<span>Admin monitoring mode</span>}'''
          s = s.replace(old, new)
          classroom.write_text(s)

          dashboard = Path('app/dashboard/page.tsx')
          d = dashboard.read_text()
          old = ''' const [u,setU]=useState<U|null>(null),[lessons,setLessons]=useState<any[]>([]),[materials,setMaterials]=useState<any[]>([]),[students,setStudents]=useState<any[]>([]),[teachers,setTeachers]=useState<any[]>([]),[cancellations,setCancellations]=useState<any[]>([]),[notifications,setNotifications]=useState<any[]>([]),[branding,setBranding]=useState<any>(null),[serverTime,setServerTime]=useState(new Date()),[selectedLesson,setSelectedLesson]=useState<any>(null),[ratingSelections,setRatingSelections]=useState<Record<string,number>>({}),[ratingSubmitting,setRatingSubmitting]=useState(false),[ratingMessage,setRatingMessage]=useState(""),[cancelReason,setCancelReason]=useState(""),[cancelMessage,setCancelMessage]=useState(""),[cancelSubmitting,setCancelSubmitting]=useState(false),[teacherNotePrompt,setTeacherNotePrompt]=useState(false),[teacherNoteRead,setTeacherNoteRead]=useState(false);'''
          new = ''' const [u,setU]=useState<U|null>(null),[lessons,setLessons]=useState<any[]>([]),[materials,setMaterials]=useState<any[]>([]),[students,setStudents]=useState<any[]>([]),[teachers,setTeachers]=useState<any[]>([]),[cancellations,setCancellations]=useState<any[]>([]),[notifications,setNotifications]=useState<any[]>([]),[teacherRecords,setTeacherRecords]=useState<any[]>([]),[branding,setBranding]=useState<any>(null),[serverTime,setServerTime]=useState(new Date()),[selectedLesson,setSelectedLesson]=useState<any>(null),[ratingSelections,setRatingSelections]=useState<Record<string,number>>({}),[ratingSubmitting,setRatingSubmitting]=useState(false),[ratingMessage,setRatingMessage]=useState(""),[cancelReason,setCancelReason]=useState(""),[cancelMessage,setCancelMessage]=useState(""),[cancelSubmitting,setCancelSubmitting]=useState(false),[teacherNotePrompt,setTeacherNotePrompt]=useState(false),[teacherNoteRead,setTeacherNoteRead]=useState(false);'''
          d = d.replace(old, new)

          old = '''setU(j.user);if(j.user.role==="ADMIN"){fetch("/api/materials",{cache:"no-store"}).then(x=>x.ok?x.json():[]).then(setMaterials).catch(()=>{});fetch("/api/students",{cache:"no-store"}).then(x=>x.ok?x.json():[]).then(setStudents).catch(()=>{});fetch("/api/teachers",{cache:"no-store"}).then(x=>x.ok?x.json():[]).then(setTeachers).catch(()=>{});}fetch("/api/lessons?"+new URLSearchParams({startDate:today,endDate:today}).toString(),{cache:"no-store"}).then(x=>x.ok?x.json():[]).then(setLessons).catch(()=>{});'''
          new = '''setU(j.user);if(j.user.role==="ADMIN"){fetch("/api/materials",{cache:"no-store"}).then(x=>x.ok?x.json():[]).then(setMaterials).catch(()=>{});fetch("/api/students",{cache:"no-store"}).then(x=>x.ok?x.json():[]).then(setStudents).catch(()=>{});fetch("/api/teachers",{cache:"no-store"}).then(x=>x.ok?x.json():[]).then(setTeachers).catch(()=>{});}if(j.user.role==="TEACHER"){fetch("/api/records",{cache:"no-store"}).then(x=>x.ok?x.json():[]).then(setTeacherRecords).catch(()=>{});}fetch("/api/lessons?"+new URLSearchParams({startDate:today,endDate:today}).toString(),{cache:"no-store"}).then(x=>x.ok?x.json():[]).then(setLessons).catch(()=>{});'''
          d = d.replace(old, new)

          old = '''const start=new Date(selectedLesson.starts_at),end=new Date(selectedLesson.ends_at),canEnter=serverTime.getTime()>=start.getTime()-600000&&serverTime.getTime()<end.getTime();return <><h2>{u.role==="TEACHER"?"Class Details":"Lesson Details"}</h2>'''
          new = '''const start=new Date(selectedLesson.starts_at),end=new Date(selectedLesson.ends_at),classEnded=serverTime.getTime()>=end.getTime(),canEnter=serverTime.getTime()>=start.getTime()-600000&&serverTime.getTime()<end.getTime(),teacherRecord=u.role==="TEACHER"?teacherRecords.find((r:any)=>r.lesson_id===selectedLesson.id):null,reportNeeded=u.role==="TEACHER"&&classEnded&&!['CANCELLED','NO_SHOW','MISSED_BY_TEACHER','MISSED_BY_TEACHER_AND_STUDENT'].includes(selectedLesson.status)&&teacherRecord?.report_status!=="FINISHED";return <><h2>{u.role==="TEACHER"?"Class Details":"Lesson Details"}</h2>'''
          d = d.replace(old, new)

          old = '''<div className="session-enter-area">{canEnter?(u.role==="TEACHER"?<button type="button" className="session-enter-button" onClick={()=>setTeacherNotePrompt(true)}>Enter classroom</button>:<a className="session-enter-button" target="_blank" rel="noopener noreferrer" href={"/classroom/"+selectedLesson.room_code}>Enter classroom</a>):<div className="session-enter-wait">Enter classroom will appear exactly 10 minutes before the class starts.</div>}{teacherNotePrompt&&u.role==="TEACHER"&&canEnter&&<div'''
          new = '''<div className="session-enter-area">{reportNeeded?<button type="button" className="session-enter-button" onClick={()=>{window.location.href="/dashboard/records?lessonId="+encodeURIComponent(selectedLesson.id)}}>Please Report</button>:canEnter?(u.role==="TEACHER"?<button type="button" className="session-enter-button" onClick={()=>setTeacherNotePrompt(true)}>Enter classroom</button>:<a className="session-enter-button" target="_blank" rel="noopener noreferrer" href={"/classroom/"+selectedLesson.room_code}>Enter classroom</a>):<div className="session-enter-wait">Enter classroom will appear exactly 10 minutes before the class starts.</div>}{teacherNotePrompt&&u.role==="TEACHER"&&canEnter&&<div'''
          d = d.replace(old, new)
          dashboard.write_text(d)

          records = Path('app/dashboard/records/page.tsx')
          r = records.read_text()
          r2 = r.replace('const opts=[100,95,90,85,80,75,70];','const opts=[100,95,90,85,80,75,70,65,60,55,50];')
          if r2 == r:
              raise SystemExit('Report score options replacement did not match')
          records.write_text(r2)
          print('GEAO fixes applied')
          PY
      - name: Commit fixes
        run: |
          git config user.name "GEAO Automation"
          git config user.email "admin@globalenglishacademyonline.co.za"
          git add app/classroom/'[room]'/page.tsx app/dashboard/page.tsx app/dashboard/records/page.tsx .github/workflows/geao-classroom-report-fix.yml
          git commit -m "[geao-fix] Fix classroom cameras, student tools, and report flow" || exit 0
          git push
