name: GEAO student page control fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'Student classroom tools only')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove student page controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/classroom/[room]/page.tsx')
          s = p.read_text()
          pattern = r'\}\s*:\s*student\?\s*<><strong>Student Tools</strong>.*?<\/>'
          m = re.search(pattern, s, flags=re.S)
          if not m:
              raise SystemExit('Could not locate student classroom tools block')
          block = m.group(0)
          block = re.sub(r'<span className="tool-spacer"\s*/>\s*<button[^>]*>‹</button>\s*<span className="page-count">Page 1</span>\s*<button[^>]*>›</button>', '', block)
          block = re.sub(r'<span className="tool-spacer"\s*/>\s*<button[^>]*disabled=\{!interactive\}[^>]*>‹</button>\s*<span className="page-count">Page 1</span>\s*<button[^>]*disabled=\{!interactive\}[^>]*>›</button>', '', block)
          s = s[:m.start()] + block + s[m.end():]
          p.write_text(s)
          print('Student page navigation controls removed; classroom tools retained.')
          PY
      - name: Commit patch
        run: |
          git config user.name "GEAO Automation"
          git config user.email "admin@globalenglishacademyonline.co.za"
          git add app/classroom/'[room]'/page.tsx .github/workflows/geao-student-page-controls.yml
          git commit -m "[geao-fix] Student classroom tools only; teacher controls pages" || exit 0
          git push
