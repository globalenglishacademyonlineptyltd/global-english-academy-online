name: GEAO student page control fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'Student classroom tools only')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove student page controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/classroom/[room]/page.tsx')
          s = p.read_text()
          replacements = [
            ('<span className="tool-spacer"/><button disabled={!interactive}>‹</button><span className="page-count">Page 1</span><button disabled={!interactive}>›</button>', ''),
            ('<span className="tool-spacer"/><button disabled={!interactive}>‹</button><span className="page-count">Page 1</span><button disabled={!interactive}>›</button>', ''),
          ]
          changed = False
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new)
                  changed = True
          if not changed:
              # Remove the student-only navigation fragment even if formatting differs.
              import re
              patterns = [
                r'<span className="tool-spacer"\s*/>\s*<button\s+disabled=\{!interactive\}[^>]*>‹</button>\s*<span className="page-count">Page 1</span>\s*<button\s+disabled=\{!interactive\}[^>]*>›</button>',
                r'<span className="tool-spacer"\s*/>\s*<button[^>]*>‹</button>\s*<span className="page-count">Page 1</span>\s*<button[^>]*>›</button>'
              ]
              for pattern in patterns:
                  s2, n = re.subn(pattern, '', s)
                  if n:
                      s = s2
                      changed = True
                      break
          if not changed:
              raise SystemExit('Student page navigation fragment was not found')
          p.write_text(s)
          print('Student page navigation controls removed; student tools retained.')
          PY
      - name: Commit patch
        run: |
          git config user.name "GEAO Automation"
          git config user.email "admin@globalenglishacademyonline.co.za"
          git add app/classroom/'[room]'/page.tsx .github/workflows/geao-student-page-controls.yml
          git commit -m "[geao-fix] Student classroom tools only; teacher controls pages" || exit 0
          git push
