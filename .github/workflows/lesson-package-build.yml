name: Lesson package build validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/student-lesson-packages]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
        env:
          AUTH_SECRET: ci-build-only-secret-not-for-production
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
